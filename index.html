
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WIN GRAM</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10111b;color:white;font-family:Arial,sans-serif;text-align:center;padding:20px}
h1{font-size:32px;margin:20px 0 5px}
.sub{color:#aaa;margin-bottom:30px}
.teams{display:flex;gap:12px;margin:25px 0}
.team{flex:1;padding:28px 8px;border-radius:18px;border:2px solid #333;background:#1b1d2b;font-size:23px;font-weight:bold;cursor:pointer}
.ice{color:#45caff}
.fire{color:#ff6848}
.selected{border-color:#fff;box-shadow:0 0 15px #777}
button{width:100%;padding:17px;border:0;border-radius:13px;background:#795cff;color:white;font-size:18px;font-weight:bold;margin-top:15px}
#status{margin-top:22px;color:#bbb;min-height:45px}
.small{color:#777;font-size:12px;margin-top:30px}
</style>
</head>
<body>
<h1>🔥 WIN GRAM</h1>
<div class="sub">ICE vs FIRE BATTLE</div>

<div class="teams">
  <div class="team ice" id="ice" onclick="choose('ICE')">❄️ ICE</div>
  <div class="team fire" id="fire" onclick="choose('FIRE')">🔥 FIRE</div>
</div>

<button onclick="joinBattle()">JOIN BATTLE</button>
<div id="status">Jamoangni tanla!</div>
<div class="small">WIN GRAM • BATTLE ARENA</div>

<script>
const SUPABASE_URL = "https://kaoysmtcufrubckjpksa.supabase.co";
const SUPABASE_KEY = "sb_publishable_uvLZfr7u9AVdBSCexxgjdw_pRWVOCV3";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let selectedTeam = "";

function choose(team){
  selectedTeam = team;
  document.getElementById("ice").classList.toggle("selected",team==="ICE");
  document.getElementById("fire").classList.toggle("selected",team==="FIRE");
  document.getElementById("status").textContent = team+" jamoasini tanlading!";
}

function joinBattle(){
  if(!selectedTeam){
    document.getElementById("status").textContent="Avval ICE yoki FIRE ni tanla!";
    return;
  }
  document.getElementById("status").textContent =
    selectedTeam+" tanlandi. Serverdagi haqiqiy jang uchun xavfsiz matchmaking hali sozlanmoqda.";
}
</script>
</body>
</html>
